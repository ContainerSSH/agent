name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Run go generate
        run: go generate
      - name: Run go tests
        run: go test -cover -p 1 -v ./...
